name: Quality

on:
  push:
    branches: [main]
  pull_request:

# Never cancel a build on main — two merges seconds apart used to kill the
# first one's verification run.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No `paths` filter, ever: a filtered workflow simply never reports on a PR
# that misses the filter, and a PR is then blocked forever on a required check
# that will never arrive.

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test
        run: pytest
