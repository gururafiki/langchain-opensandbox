[project]
name = "langchain-opensandbox"
version = "0.1.0"
description = "OpenSandbox sandbox backend for LangChain deep agents"
authors = [
    { name = "Alex March", email = "broaden.your@outlook.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["langchain", "langgraph", "deepagents", "opensandbox", "sandbox", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # `BaseSandbox` / `SandboxBackendProtocol` live here. The 0.6.x line is what
    # `factory.py` targets: `get_backend` is a `BackendFactory`
    # (`deepagents.backends.protocol.BackendFactory`), a type alias that
    # deepagents `main` has since dropped. `backend.py` carries no such coupling
    # and only needs `BaseSandbox`.
    "deepagents>=0.6.12,<0.7",
    # The OpenSandbox client. `factory.py` uses both the sync
    # (`opensandbox.sync.*`) and async (`opensandbox.sandbox.Sandbox`,
    # `opensandbox.manager.SandboxManager`) surfaces.
    "opensandbox>=0.1.15",
    "pydantic>=2.4.2,<3",
]

[project.urls]
Homepage = "https://github.com/gururafiki/langchain-opensandbox"
Repository = "https://github.com/gururafiki/langchain-opensandbox"
Issues = "https://github.com/gururafiki/langchain-opensandbox/issues"

[project.optional-dependencies]
dev = [
    "mypy>=2.1",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
# Ship the PEP 561 marker so consumers get the inline types.
langchain_opensandbox = ["py.typed"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = []
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The opensandbox client ships no inline types and has no stubs package.
module = ["opensandbox.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "-ra", "--strict-markers"]
markers = [
    "unit: Unit tests for individual components",
]
